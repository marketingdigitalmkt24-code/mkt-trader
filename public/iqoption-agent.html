<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IQ Option - Agente Local</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #00d4aa;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      margin-bottom: 15px;
    }
    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff4444;
    }
    .status-dot.connected { background: #00d4aa; }
    .status-dot.connecting { background: #ffaa00; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #aaa;
      font-size: 14px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      background: rgba(0,0,0,0.3);
      color: #fff;
      font-size: 16px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #00d4aa;
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #00d4aa 0%, #00a085 100%);
      color: #fff;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,212,170,0.4); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-danger {
      background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
      color: #fff;
    }
    
    .info-box {
      background: rgba(0,212,170,0.1);
      border: 1px solid rgba(0,212,170,0.3);
      border-radius: 8px;
      padding: 15px;
      margin-top: 20px;
    }
    .info-box h3 {
      color: #00d4aa;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .info-box code {
      background: rgba(0,0,0,0.3);
      padding: 8px 12px;
      border-radius: 6px;
      display: block;
      font-family: monospace;
      word-break: break-all;
      margin-top: 5px;
    }
    
    .balance-display {
      text-align: center;
      padding: 20px;
    }
    .balance-amount {
      font-size: 36px;
      font-weight: 700;
      color: #00d4aa;
    }
    .balance-type {
      font-size: 14px;
      color: #888;
      margin-top: 5px;
    }
    
    .log {
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      padding: 15px;
      max-height: 200px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
    }
    .log-entry {
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .log-entry.error { color: #ff4444; }
    .log-entry.success { color: #00d4aa; }
    .log-entry.info { color: #aaa; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤖 IQ Option Agente Local</h1>
    
    <div class="card">
      <div class="status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Desconectado</span>
      </div>
      
      <div id="loginForm">
        <div class="form-group">
          <label>Email IQ Option</label>
          <input type="email" id="email" placeholder="seu@email.com">
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="password" placeholder="••••••••">
        </div>
        <div class="form-group">
          <label>Tipo de Conta</label>
          <select id="accountType">
            <option value="PRACTICE">Demo (Prática)</option>
            <option value="REAL">Real</option>
          </select>
        </div>
        <button class="btn-primary" id="connectBtn" onclick="connect()">Conectar</button>
      </div>
      
      <div id="connectedView" style="display: none;">
        <div class="balance-display">
          <div class="balance-amount" id="balanceAmount">$0.00</div>
          <div class="balance-type" id="balanceType">Conta Demo</div>
        </div>
        <button class="btn-danger" onclick="disconnect()">Desconectar</button>
      </div>
    </div>
    
    <div class="card" id="agentInfo" style="display: none;">
      <div class="info-box">
        <h3>✅ Agente Ativo - Use esta URL no Painel Admin:</h3>
        <code id="agentUrl">-</code>
        <p style="margin-top: 10px; font-size: 12px; color: #888;">
          Cole esta URL no campo "URL do Agente Local" nas configurações da IQ Option no painel.
        </p>
      </div>
    </div>
    
    <div class="card">
      <label>Log de Atividade</label>
      <div class="log" id="log"></div>
    </div>
  </div>

  <script>
    // Estado do agente
    let ws = null;
    let ssid = null;
    let balance = { practice: 0, real: 0 };
    let accountType = 'PRACTICE';
    let isConnected = false;
    let assets = {};
    let pendingRequests = new Map();
    
    // Comunicação com o painel via BroadcastChannel
    const channel = new BroadcastChannel('iqoption_agent');
    
    function log(message, type = 'info') {
      const logEl = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logEl.insertBefore(entry, logEl.firstChild);
      console.log(`[Agent] ${message}`);
    }
    
    function updateStatus(status, text) {
      const dot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      dot.className = `status-dot ${status}`;
      statusText.textContent = text;
    }
    
    function updateBalance(practiceBalance, realBalance) {
      balance.practice = practiceBalance || balance.practice;
      balance.real = realBalance || balance.real;
      
      const amount = accountType === 'PRACTICE' ? balance.practice : balance.real;
      document.getElementById('balanceAmount').textContent = `$${amount.toFixed(2)}`;
      document.getElementById('balanceType').textContent = accountType === 'PRACTICE' ? 'Conta Demo' : 'Conta Real';
      
      // Notificar painel
      broadcastState();
    }
    
    function broadcastState() {
      channel.postMessage({
        type: 'state',
        data: {
          connected: isConnected,
          balance: accountType === 'PRACTICE' ? balance.practice : balance.real,
          accountType,
          assets: Object.values(assets).filter(a => a.enabled)
        }
      });
    }
    
    // Escutar comandos do painel
    channel.onmessage = async (event) => {
      const { type, requestId, data } = event.data;
      log(`Comando recebido: ${type}`, 'info');
      
      try {
        switch (type) {
          case 'ping':
            channel.postMessage({ type: 'pong', requestId, data: { connected: isConnected } });
            break;
            
          case 'getState':
            channel.postMessage({ 
              type: 'stateResponse', 
              requestId, 
              data: {
                connected: isConnected,
                balance: accountType === 'PRACTICE' ? balance.practice : balance.real,
                accountType,
                assets: Object.values(assets).filter(a => a.enabled)
              }
            });
            break;
            
          case 'placeTrade':
            if (!isConnected) {
              channel.postMessage({ type: 'tradeResponse', requestId, error: 'Não conectado' });
              return;
            }
            const result = await placeTrade(data.asset, data.direction, data.amount, data.expiration);
            channel.postMessage({ type: 'tradeResponse', requestId, data: result });
            break;
            
          case 'getBalance':
            channel.postMessage({ 
              type: 'balanceResponse', 
              requestId, 
              data: { 
                balance: accountType === 'PRACTICE' ? balance.practice : balance.real,
                accountType 
              }
            });
            break;
        }
      } catch (error) {
        channel.postMessage({ type: 'error', requestId, error: error.message });
      }
    };
    
    async function connect() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      accountType = document.getElementById('accountType').value;
      
      if (!email || !password) {
        log('Preencha email e senha', 'error');
        return;
      }
      
      document.getElementById('connectBtn').disabled = true;
      updateStatus('connecting', 'Conectando...');
      log('Iniciando login na IQ Option...', 'info');
      
      try {
        // Login HTTP para obter SSID
        const loginResponse = await fetch('https://auth.iqoption.com/api/v2/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: `identifier=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`
        });
        
        const loginData = await loginResponse.json();
        
        if (!loginData.ssid) {
          throw new Error(loginData.message || 'Falha no login - verifique suas credenciais');
        }
        
        ssid = loginData.ssid;
        log('Login HTTP OK, conectando WebSocket...', 'success');
        
        // Conectar WebSocket
        await connectWebSocket();
        
      } catch (error) {
        log(`Erro: ${error.message}`, 'error');
        updateStatus('', 'Erro na conexão');
        document.getElementById('connectBtn').disabled = false;
      }
    }
    
    function connectWebSocket() {
      return new Promise((resolve, reject) => {
        ws = new WebSocket('wss://iqoption.com/echo/websocket');
        
        const timeout = setTimeout(() => {
          reject(new Error('Timeout na conexão WebSocket'));
        }, 15000);
        
        ws.onopen = () => {
          log('WebSocket conectado, autenticando...', 'info');
          ws.send(JSON.stringify({ name: 'ssid', msg: ssid }));
        };
        
        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            handleMessage(data, resolve, reject, timeout);
          } catch (e) {
            console.error('Parse error:', e);
          }
        };
        
        ws.onerror = (error) => {
          clearTimeout(timeout);
          reject(new Error('Erro no WebSocket'));
        };
        
        ws.onclose = () => {
          if (isConnected) {
            log('Conexão perdida', 'error');
            handleDisconnect();
          }
        };
      });
    }
    
    function handleMessage(data, resolve, reject, timeout) {
      switch (data.name) {
        case 'profile':
          clearTimeout(timeout);
          log('Autenticado com sucesso!', 'success');
          
          // Extrair saldos
          if (data.msg?.balances) {
            data.msg.balances.forEach(b => {
              if (b.type === 1) balance.practice = b.amount;
              if (b.type === 4) balance.real = b.amount;
            });
          }
          
          // Solicitar dados adicionais
          ws.send(JSON.stringify({ name: 'setOptions', msg: { sendResults: true } }));
          ws.send(JSON.stringify({ name: 'subscribeMessage', msg: { name: 'balance-changed' } }));
          ws.send(JSON.stringify({ name: 'getInitializationData', msg: {} }));
          
          handleConnected();
          resolve();
          break;
          
        case 'initialization-data':
          if (data.msg?.binary?.actives) {
            Object.entries(data.msg.binary.actives).forEach(([id, info]) => {
              assets[id] = {
                id: parseInt(id),
                name: info.name || `Asset ${id}`,
                enabled: info.enabled,
                isSuspended: info.is_suspended
              };
            });
            log(`${Object.keys(assets).length} ativos carregados`, 'success');
            broadcastState();
          }
          break;
          
        case 'balance-changed':
          if (data.msg) {
            if (data.msg.current_balance?.type === 1) {
              balance.practice = data.msg.current_balance.amount;
            } else if (data.msg.current_balance?.type === 4) {
              balance.real = data.msg.current_balance.amount;
            }
            updateBalance();
          }
          break;
          
        case 'option':
        case 'option-opened':
          const reqId = data.request_id || data.msg?.request_id;
          if (reqId && pendingRequests.has(reqId)) {
            pendingRequests.get(reqId).resolve(data.msg);
            pendingRequests.delete(reqId);
          }
          break;
      }
    }
    
    function handleConnected() {
      isConnected = true;
      updateStatus('connected', 'Conectado');
      updateBalance();
      
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('connectedView').style.display = 'block';
      document.getElementById('agentInfo').style.display = 'block';
      document.getElementById('agentUrl').textContent = window.location.href;
      
      // Salvar credenciais localmente
      localStorage.setItem('iq_email', document.getElementById('email').value);
      localStorage.setItem('iq_account_type', accountType);
      
      broadcastState();
    }
    
    function handleDisconnect() {
      isConnected = false;
      updateStatus('', 'Desconectado');
      
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('connectedView').style.display = 'none';
      document.getElementById('agentInfo').style.display = 'none';
      document.getElementById('connectBtn').disabled = false;
      
      broadcastState();
    }
    
    function disconnect() {
      if (ws) {
        ws.close();
        ws = null;
      }
      handleDisconnect();
      log('Desconectado manualmente', 'info');
    }
    
    async function placeTrade(assetName, direction, amount, expirationMinutes) {
      return new Promise((resolve, reject) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          reject(new Error('WebSocket não conectado'));
          return;
        }
        
        // Encontrar ID do ativo
        const asset = Object.values(assets).find(a => 
          a.name.toLowerCase().includes(assetName.toLowerCase().replace('/', '').replace('-otc', '-OTC'))
        );
        
        if (!asset) {
          reject(new Error(`Ativo não encontrado: ${assetName}`));
          return;
        }
        
        const requestId = `trade_${Date.now()}`;
        const balanceType = accountType === 'PRACTICE' ? 1 : 4;
        const now = Math.floor(Date.now() / 1000);
        const expTime = now + (expirationMinutes * 60);
        
        pendingRequests.set(requestId, { resolve, reject, timeout: setTimeout(() => {
          pendingRequests.delete(requestId);
          reject(new Error('Timeout na operação'));
        }, 30000) });
        
        const message = {
          name: 'binary-options.open-option',
          msg: {
            user_balance_id: balanceType,
            active_id: asset.id,
            option_type_id: 3,
            direction: direction.toLowerCase(),
            expired: expTime,
            price: amount,
            request_id: requestId
          }
        };
        
        log(`Abrindo operação: ${assetName} ${direction} $${amount}`, 'info');
        ws.send(JSON.stringify(message));
      });
    }
    
    // Carregar credenciais salvas
    window.onload = () => {
      const savedEmail = localStorage.getItem('iq_email');
      const savedType = localStorage.getItem('iq_account_type');
      
      if (savedEmail) document.getElementById('email').value = savedEmail;
      if (savedType) document.getElementById('accountType').value = savedType;
      
      log('Agente iniciado. Aguardando conexão...', 'info');
    };
  </script>
</body>
</html>
